services:
  - type: web
    name: pharmacy-pos-cockpit
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 300 --workers 2
    envVars:
      - key: PHARMACY_SECRET_KEY
        generateValue: true
      - key: PHARMACY_ADMIN_USERNAME
        value: admin
      - key: PHARMACY_ADMIN_PASSWORD
        sync: false
      # PostgreSQL connection string (Render, Supabase, Neon...). Without it data is in SQLite
      # on the instance disk, which Render wipes on every deploy.
      - key: DATABASE_URL
        sync: false
