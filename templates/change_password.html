{% extends "base.html" %}
{% block content %}
<section class="page-head">
  <div>
    <p class="eyebrow">{{ t("account") }}</p>
    <h1>{{ t("change_password") }}</h1>
  </div>
</section>

<form class="panel form narrow-form" method="post">
  <label class="wide">
    <span>{{ t("current_password") }}</span>
    <input type="password" name="current_password" autocomplete="current-password" required>
  </label>
  <label class="wide">
    <span>{{ t("new_password") }}</span>
    <input type="password" name="new_password" autocomplete="new-password" minlength="8" required>
  </label>
  <label class="wide">
    <span>{{ t("confirm_new_password") }}</span>
    <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
  </label>
  <button class="button primary" type="submit">{{ t("save_password") }}</button>
</form>
{% endblock %}
