<!doctype html>
<html lang="{{ lang }}" dir="{{ text_dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t("login") }} - {{ t("app_name") }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img" focusable="false">
            <path class="logo-hands" d="M9 29c4 0 6 4 10 4h10c4 0 6-4 10-4" />
            <path class="logo-bowl" d="M13 30c2 7 7 11 11 11s9-4 11-11" />
            <path class="logo-cross" d="M21 8h6v8h8v6h-8v8h-6v-8h-8v-6h8z" />
          </svg>
        </span>
        <div>
          <p class="eyebrow">{{ t("app_name") }}</p>
          <p class="brand-description">{{ t("app_description") }}</p>
          <h1>{{ t("login") }}</h1>
        </div>
      </div>
      <form class="language-form auth-language" method="post" action="{{ url_for('set_language', lang_code=next_lang) }}">
        <button type="submit">{{ t("language_toggle") }}</button>
      </form>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="messages">
            {% for category, message in messages %}
              <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="post" class="auth-form">
        <label>
          <span>{{ t("username") }}</span>
          <input name="username" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>{{ t("password") }}</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="button primary" type="submit">{{ t("login") }}</button>
      </form>
    </section>
  </main>
</body>
</html>
